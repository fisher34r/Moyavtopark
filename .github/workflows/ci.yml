name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew clean assembleDebug

      - name: Rename APK file
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -1 | awk -F'"' '{print $2}')
          APK_NAME="MoyAvtopark-v${VERSION_NAME}-b${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "APP_VERSION=${VERSION_NAME}" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoyAvtopark-apk
          path: ${{ env.APK_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}.${{ github.run_number }}
          name: Мой Автопарк v${{ env.APP_VERSION }} (Сборка ${{ github.run_number }})
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: ${{ env.APK_NAME }}
